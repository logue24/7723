name = "qrelay-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Tạo namespace tại: Cloudflare Dashboard > Workers & Pages > KV > Create a namespace
# (đặt tên gì cũng được, ví dụ "qrelay-codes") rồi dán "id" của nó vào đây.
[[kv_namespaces]]
binding = "CODES"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Account ID: xem ở Cloudflare Dashboard > Workers & Pages (góc phải trang tổng quan)
R2_ACCOUNT_ID = "PASTE_CLOUDFLARE_ACCOUNT_ID_HERE"
R2_BUCKET_NAME = "qrelay-files"

# R2_ACCESS_KEY_ID và R2_SECRET_ACCESS_KEY KHÔNG khai báo ở đây (đây là secret).
# Set sau khi Worker được tạo, tại: Worker > Settings > Variables and Secrets > Add
# (kiểu Secret/Encrypt) — làm được hoàn toàn trên trình duyệt, không cần máy tính/CLI.
