<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chia sẻ trang</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: transparent;
    color: #000;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 28px 20px;
    border-radius: 20px;
    background: transparent;
  }
  .icon {
    width: 64px;
    height: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: #000;
    color: #fff;
    margin-bottom: 14px;
  }
  .icon svg { width: 32px; height: 32px; }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    color: #000;
  }
  p {
    margin: 0 0 18px;
    font-size: 15px;
    color: #000;
  }
  .link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #000;
    font-weight: 600;
    border: 2px solid #000;
    border-radius: 999px;
    padding: 10px 18px;
    margin-bottom: 18px;
    word-break: break-word;
  }
  .link:hover { background: #000; color: #fff; }
  .qr {
    width: 200px;
    height: 200px;
    display: block;
    margin: 0 auto;
    border-radius: 12px;
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: #000;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8h16v-8"/>
        <path d="M12 3v13"/>
        <path d="m7 8 5-5 5 5"/>
      </svg>
    </div>

    <h1>Chia sẻ trang của tôi</h1>
    <p>Quét mã QR hoặc mở liên kết bên dưới.</p>

    <a class="link" href="https://sites.google.com/view/id-card-smart/trang-ch%E1%BB%A7" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/>
        <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
      </svg>
      Mở trang
    </a>

    <img class="qr"
         src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=https%3A%2F%2Fsites.google.com%2Fview%2Fid-card-smart%2Ftrang-ch%E1%BB%A7"
         alt="Mã QR đến trang ID Card Smart"
         loading="lazy">

    <div class="hint">Quét mã QR bằng camera điện thoại</div>
  </main>
</body>
</html>
