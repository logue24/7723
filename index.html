<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card Smart</title>
<meta name="description" content="Truy cập nhanh ID Card Smart">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪪</text></svg>">

<style>
  :root{
    --glass: rgba(255,255,255,.14);
    --border: rgba(255,255,255,.28);
    --text: #ffffff;
    --muted: rgba(255,255,255,.78);
    --accent: #7c5cff;
    --accent2: #00d4ff;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    min-height:100%;
    background:transparent !important;
    color:var(--text);
    font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:430px;
    padding:30px 26px;
    border-radius:28px;
    background:var(--glass);
    border:1px solid var(--border);
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    text-align:center;
  }

  .logo{
    width:76px;height:76px;
    margin:0 auto 18px;
    border-radius:24px;
    display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 30px rgba(124,92,255,.35);
  }

  .logo svg{width:38px;height:38px;color:#fff}

  h1{
    font-size:26px;
    font-weight:800;
    letter-spacing:.3px;
    margin-bottom:8px;
  }

  p.sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    margin-bottom:22px;
  }

  .link-box{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    border-radius:16px;
    background:rgba(255,255,255,.10);
    border:1px solid var(--border);
    margin-bottom:16px;
  }

  .link-box svg{width:20px;height:20px;flex:0 0 auto;opacity:.9}
  .link-box span{
    flex:1;
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:22px;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 12px;
    border:0;
    border-radius:16px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    text-decoration:none;
    transition:transform .15s ease, filter .15s ease;
  }

  .btn svg{width:18px;height:18px}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn:active{transform:scale(.98)}

  .open{background:linear-gradient(135deg,#7c5cff,#00d4ff)}
  .copy{background:rgba(255,255,255,.16);border:1px solid var(--border)}

  .qr{
    padding:18px;
    border-radius:22px;
    background:rgba(255,255,255,.94);
    display:inline-block;
  }

  .qr img{
    display:block;
    width:190px;height:190px;
    border-radius:10px;
  }

  .qr-note{
    margin-top:12px;
    font-size:12.5px;
    color:var(--muted);
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%,20px);
    padding:12px 20px;
    border-radius:999px;
    background:rgba(20,20,25,.88);
    border:1px solid rgba(255,255,255,.18);
    color:#fff;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
    backdrop-filter:blur(10px);
  }

  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:380px){
    .card{padding:24px 18px}
    .qr img{width:160px;height:160px}
  }
</style>
</head>

<body>
<main class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="3"/>
      <circle cx="8" cy="11" r="2"/>
      <path d="M5 17c.6-1.6 1.7-2.4 3-2.4s2.4.8 3 2.4"/>
      <path d="M14 10h5M14 14h3"/>
    </svg>
  </div>

  <h1>ID Card Smart</h1>
  <p class="sub">Quét mã QR hoặc nhấn nút bên dưới để mở trang chính thức.</p>

  <div class="link-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
      <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
    </svg>
    <span>sites.google.com/view/id-card-smart</span>
  </div>

  <div class="actions">
    <a class="btn open" href="https://sites.google.com/view/id-card-smart/trang-ch%E1%BB%A7" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <path d="M15 3h6v6"/>
        <path d="M10 14 21 3"/>
      </svg>
      Mở trang
    </a>

    <button class="btn copy" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Sao chép
    </button>
  </div>

  <div class="qr">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&ecc=H&margin=12&data=https%3A%2F%2Fsites.google.com%2Fview%2Fid-card-smart%2Ftrang-ch%E1%BB%A7"
      alt="Mã QR mở ID Card Smart"
      loading="lazy">
  </div>

  <p class="qr-note">Dùng camera điện thoại để quét mã QR và truy cập trang.</p>
</main>

<div class="toast" id="toast">Đã sao chép liên kết!</div>

<script>
  const SITE_URL = "https://sites.google.com/view/id-card-smart/trang-ch%E1%BB%A7";
  const copyBtn = document.getElementById("copyBtn");
  const toast = document.getElementById("toast");

  function showToast(message){
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  copyBtn.addEventListener("click", async () => {
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(SITE_URL);
      }else{
        const input = document.createElement("textarea");
        input.value = SITE_URL;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast("Đã sao chép liên kết!");
    }catch(e){
      showToast("Không thể sao chép. Vui lòng sao chép thủ công.");
    }
  });
</script>
</body>
</html>
