<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chia sẻ trang</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: transparent;
    color: #000;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding: 28px 20px;
    border-radius: 20px;
    background: transparent;
  }
  .icon {
    width: 64px;
    height: 64px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: #000;
    color: #fff;
    margin-bottom: 14px;
  }
  .icon svg { width: 32px; height: 32px; }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    color: #000;
  }
  p {
    margin: 0 0 18px;
    font-size: 15px;
    color: #000;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #000;
    background: transparent;
    font: inherit;
    font-weight: 600;
    border: 2px solid #000;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: .2s;
  }
  .btn:hover,
  .btn:focus-visible {
    background: #000;
    color: #fff;
    outline: none;
  }
  .qr {
    width: 200px;
    height: 200px;
    display: block;
    margin: 0 auto;
    border-radius: 12px;
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: #000;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8h16v-8"/>
        <path d="M12 3v13"/>
        <path d="m7 8 5-5 5 5"/>
      </svg>
    </div>

    <h1>Chia sẻ trang của tôi</h1>
    <p>Quét mã QR, mở liên kết hoặc chia sẻ nhanh.</p>

    <div class="actions">
      <a class="btn" href="https://sites.google.com/view/id-card-smart/trang-ch%E1%BB%A7" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/>
          <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
        </svg>
        Mở trang
      </a>

      <button class="btn" id="shareButton" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <path d="m8.6 13.5 6.8 4"/>
          <path d="m15.4 6.5-6.8 4"/>
        </svg>
        Chia sẻ
      </button>
    </div>

    <img class="qr"
         src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=https%3A%2F%2Fsites.google.com%2Fview%2Fid-card-smart%2Ftrang-ch%E1%BB%A7"
         alt="Mã QR đến trang ID Card Smart"
         loading="lazy">

    <div class="hint">Quét mã QR bằng camera điện thoại</div>
  </main>

<script>
  const shareButton = document.getElementById("shareButton");
  const pageUrl = "https://sites.google.com/view/id-card-smart/trang-ch%E1%BB%A7";
  const shareData = {
    title: "ID Card Smart",
    text: "Xem trang của tôi:",
    url: pageUrl
  };

  shareButton.addEventListener("click", async () => {
    try {
      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        await navigator.share(shareData);
        return;
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(pageUrl);
        alert("Đã sao chép liên kết. Bạn có thể dán để chia sẻ.");
        return;
      }

      window.open(
        "https://wa.me/?text=" + encodeURIComponent("Xem trang của tôi: " + pageUrl),
        "_blank",
        "noopener"
      );
    } catch (error) {
      if (error && error.name !== "AbortError") {
        alert("Không thể chia sẻ lúc này. Vui lòng sao chép liên kết thủ công.");
      }
    }
  });
</script>
</body>
</html>
